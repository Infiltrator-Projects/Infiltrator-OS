name: Build Infiltrator OS DEB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Determine package version
        shell: bash
        run: |
          version="$(cat VERSION)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Build package
        shell: bash
        run: |
          VERSION="$VERSION" bash scripts/build-deb.sh

      - name: Inspect package
        shell: bash
        run: |
          sh -n scripts/build-deb.sh scripts/install-os.sh debian/postinst debian/prerm
          for package in dist/*.deb; do
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
          done
          test "$(dpkg-deb -f "dist/infiltrator-os_${VERSION}_all.deb" Package)" = infiltrator-os
          test "$(dpkg-deb -f "dist/infiltrator-os_${VERSION}_all.deb" Version)" = "$VERSION"
          test "$(dpkg-deb -f "dist/infiltrator-os_${VERSION}_all.deb" Depends | tr ',' '\n' | wc -l)" -eq 9

      - name: Package source
        shell: bash
        run: git archive --format=zip --prefix="infiltrator-os-${VERSION}/" HEAD > "dist/infiltrator-os-${VERSION}-source.zip"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: infiltrator-os-${{ env.VERSION }}
          path: |
            dist/*.deb
            dist/*.run
            dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; bump VERSION for another release."
          else
            gh release create "$RELEASE_TAG" dist/*.deb dist/*.run dist/*.zip \
              --target "$GITHUB_SHA" \
              --title "Infiltrator OS $RELEASE_TAG" \
              --generate-notes
          fi

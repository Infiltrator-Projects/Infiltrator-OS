name: Build Infiltrator OS DEB

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install package build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev

      - name: Determine package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "VERSION=1.0.4" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v1.0.4" >> "$GITHUB_ENV"
          fi

      - name: Build package
        shell: bash
        run: |
          VERSION="$VERSION" bash scripts/build-deb.sh

      - name: Inspect package
        shell: bash
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: infiltrator-os-plymouth-theme-${{ env.VERSION }}
          path: dist/*.deb
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/heads/main && "$RELEASE_TAG" == v1.0.4 ]]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
                -f sha="$GITHUB_SHA" -F force=true
              gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA"
              gh release delete-asset "$RELEASE_TAG" "infiltrator-os-plymouth-theme_${VERSION}_amd64.deb" -y || true
            fi
            gh release upload "$RELEASE_TAG" dist/*.deb --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.deb \
              --target "$GITHUB_SHA" \
              --title "Infiltrator OS $RELEASE_TAG" \
              --generate-notes
          fi

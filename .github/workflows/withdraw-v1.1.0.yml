name: Withdraw unrequested Infiltrator OS v1.1.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  withdraw:
    runs-on: ubuntu-latest
    steps:
      - name: Delete unrequested release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v1.1.0 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
